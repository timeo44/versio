# Deploys Versio on every push to main:
#   1. tests + typecheck
#   2. API  → Supabase Edge Function "versio-api" (+ its secrets)
#   3. site → GitHub Pages (static export)
#
# Repository settings needed (Settings → Secrets and variables → Actions):
#   Variables: SPOTIFY_CLIENT_ID, SUPABASE_PROJECT_REF
#              (optional) TRANSLATION_PROVIDER, OPENAI_MODEL, ADMIN_SPOTIFY_IDS
#   Secrets:   SUPABASE_ACCESS_TOKEN, OPENAI_API_KEY (or DEEPL_API_KEY)
# And Settings → Pages → Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck

  api:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check configuration
        run: |
          missing=""
          [ -z "$PROJECT_REF" ] && missing="$missing variable SUPABASE_PROJECT_REF,"
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing secret SUPABASE_ACCESS_TOKEN,"
          if [ -n "$missing" ]; then echo "::error::Missing repository settings:$missing see README → Deploy"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:function
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Set function secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          TRANSLATION_PROVIDER: ${{ vars.TRANSLATION_PROVIDER }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ADMIN_SPOTIFY_IDS: ${{ vars.ADMIN_SPOTIFY_IDS }}
        run: |
          args=()
          for k in OPENAI_API_KEY DEEPL_API_KEY TRANSLATION_PROVIDER OPENAI_MODEL ADMIN_SPOTIFY_IDS; do
            v="${!k}"
            [ -n "$v" ] && args+=("$k=$v")
          done
          args+=("ALLOWED_ORIGINS=https://${{ github.repository_owner }}.github.io,http://127.0.0.1:3000")
          args+=("LRCLIB_USER_AGENT=Versio/1.0 (https://github.com/${{ github.repository }})")
          supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"
      - name: Deploy edge function
        run: supabase functions deploy versio-api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api

  site:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          NEXT_PUBLIC_SPOTIFY_REDIRECT_URI: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/callback
          NEXT_PUBLIC_API_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/versio-api
        run: |
          if [ -z "$NEXT_PUBLIC_SPOTIFY_CLIENT_ID" ]; then echo "::error::Missing repository variable SPOTIFY_CLIENT_ID"; exit 1; fi
          npm run build
          touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
